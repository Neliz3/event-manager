{% extends 'webui/base.html' %}
{% load static %}
{% block title %}Events{% endblock %}
{% block content %}
<div class="row">
  <div class="col s12 m4">
    <div class="input-field">
      <i class="material-icons prefix">search</i>
      <input id="event-search" type="text">
      <label for="event-search">Search by title or description</label>
    </div>
  </div>
  <div class="col s12 m2">
    <div class="input-field">
      <input id="event-organizer" type="text">
      <label for="event-organizer">Organizer username</label>
    </div>
  </div>
  <div class="col s12 m2">
    <div class="input-field">
      <input id="event-date" type="date">
      <label for="event-date" class="active">Date</label>
    </div>
  </div>
  <div class="col s12 m2">
    <div class="input-field">
      <input id="event-capacity-min" type="number" min="1">
      <label for="event-capacity-min">Min capacity</label>
    </div>
  </div>
  <div class="col s12 m2">
    <div class="input-field">
      <input id="event-capacity-max" type="number" min="1">
      <label for="event-capacity-max">Max capacity</label>
    </div>
  </div>
</div>

<div class="row" id="event-list">
  <p>Loading events…</p>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'webui/js/events.js' %}"></script>
{% endblock %}
