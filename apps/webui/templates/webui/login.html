{% extends 'webui/base.html' %}
{% load static %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row">
  <div class="col s12 m8 offset-m2 l6 offset-l3">
    <h4>Log in</h4>

    <form id="login-form">
      <div class="input-field">
        <input id="email" name="email" type="email" required>
        <label for="email">Email</label>
      </div>
      <div class="input-field">
        <input id="password" name="password" type="password" required>
        <label for="password">Password</label>
      </div>
      <button class="btn waves-effect waves-light" type="submit">
        Log in <i class="material-icons right">send</i>
      </button>
      <button id="resend-verification" type="button" class="btn-flat waves-effect hide">
        Resend verification email
      </button>
    </form>
    <p><a href="{% url 'webui-password-reset-request' %}">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'webui/js/login.js' %}"></script>
{% endblock %}
