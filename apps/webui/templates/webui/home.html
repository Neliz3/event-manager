{% extends 'webui/base.html' %}
{% block title %}Event Manager{% endblock %}
{% block content %}
<div class="row">
  <div class="col s12">
    <h4>Welcome</h4>
    <p>
      Minimal UI on top of the Event Manager JSON API — register, verify your
      email, log in, browse/search events, and change your password.
    </p>
    <a class="btn waves-effect waves-light" href="{% url 'webui-events' %}">
      Browse events <i class="material-icons right">event</i>
    </a>
    <a class="btn-flat waves-effect" href="{% url 'webui-register' %}">Create an account</a>
  </div>
</div>
{% endblock %}
