{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Event Manager{% endblock %}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>
  <nav class="teal darken-2">
    <div class="nav-wrapper container">
      <a href="{% url 'webui-home' %}" class="brand-logo">Event Manager</a>
      <ul class="right">
        <li><a href="{% url 'webui-events' %}">Events</a></li>
        <li data-nav="logged-out"><a href="{% url 'webui-login' %}">Login</a></li>
        <li data-nav="logged-out"><a href="{% url 'webui-register' %}">Register</a></li>
        <li data-nav="logged-in" class="hide"><a href="{% url 'webui-event-create' %}">New event</a></li>
        <li data-nav="logged-in" class="hide"><a href="{% url 'webui-account-profile' %}">Profile</a></li>
        <li data-nav="logged-in" class="hide"><a href="{% url 'webui-account-password' %}">Account</a></li>
        <li data-nav="logged-in" class="hide"><a href="#!" data-action="logout">Logout</a></li>
      </ul>
    </div>
  </nav>

  <main class="container" style="margin-top: 2rem;">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="{% static 'webui/js/api.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
